name: Build, Push & Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Unifi Network Application version to build'
        required: true
      url:
        description: 'Unifi Network Application download url'
        required: true
      checksum:
        description: 'Unifi Network Application artifacts checksum'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/unifi-network-application:${{ github.event.inputs.version }}
          build-args: |
            UNIFI_VERSION=${{ github.event.inputs.version }}
            UNIFI_ZIP_URL=${{ github.event.inputs.url }}
            UNIFI_CHECKSUM=${{ github.event.inputs.checksum }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
