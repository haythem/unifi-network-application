name: Check

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check:
    name: Check & Create Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check
        run: dotnet run scripts/check.cs
